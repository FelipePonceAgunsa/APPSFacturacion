<h2 mat-dialog-title>
  <mat-icon class="warning-icon">schedule</mat-icon>
  Sesión a punto de expirar
</h2>

<mat-dialog-content>
  <p class="warning-message">
    Tu sesión expirará pronto por inactividad.
    ¿Deseas continuar trabajando?
  </p>

  <div class="countdown-container" aria-live="assertive" aria-atomic="true">
    <span class="countdown-time">{{ displayTime() }}</span>
    <span class="countdown-label">restantes</span>
  </div>

  <mat-progress-bar
    mode="determinate"
    [value]="progressValue()"
    aria-label="Tiempo restante de sesión">
  </mat-progress-bar>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-flat-button
    (click)="continueSession()"
    cdkFocusInitial
    aria-label="Continuar sesión activa">
    Continuar
  </button>
</mat-dialog-actions>
