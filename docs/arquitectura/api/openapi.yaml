openapi: 3.0.3
info:
  title: ZARPE - FACTURACIÓN — API REST
  version: 1.1.0
  description: >
    Contrato de la API REST de ZARPE - FACTURACIÓN (el Satélite). Cubre lo que consume el
    frontend Angular (convenios, operaciones, OFA, facturas, pagos, ajustes) y los
    callbacks de integración que entran por Agunsa Connect (folio/DTE desde SAP).
    Alineado con modelo-datos.md (ADR-010), contratos-integracion.md (ADR-002/003/004/005),
    motor-tarifas-detalle.md (ADR-006) y convenios por carga directa (ADR-012).
    Principio: el monto nunca lo fija la IA; la IA solo propone con confirmación humana.
  contact:
    name: Arquitecto de Solución — Satélite AEXSA

servers:
  - url: https://satelite.aexsa.cl/api
    description: Producción (vía CloudFront/WAF/ALB)
  - url: https://qa-satelite.aexsa.cl/api
    description: QA

tags:
  - name: Convenios
    description: >
      Ingreso por formulario manual (por defecto), versionado y vigencia de convenios.
      La carga de documento con extracción por IA es una etapa opcional (ADR-007/012).
  - name: Catalogo
    description: Catálogo de SAP importado por archivo en la Fase A; API en la Fase B (ADR-017)
  - name: Configuracion
    description: Parámetros mantenidos por el Administrador (mapeo de terminales)
  - name: Operaciones
    description: Evento facturable, clasificación de ruta y destinatarios (REQ-001/002/003)
  - name: OFA
    description: Orden de Facturación valorizada, cálculo y ajustes (REQ-005/006/008)
  - name: Facturas
    description: Folio, DTE y conciliación (REQ-009)
  - name: Pagos
    description: Estado de pago y conciliación (REQ-010)
  - name: Omisiones
    description: Detección de servicios no facturados (REQ-007)
  - name: Callbacks
    description: Entradas de integración por Agunsa Connect (folio/DTE, eventos AEXSA)

paths:
  # ---------------------------------------------------------------- Convenios
  /convenios:
    get:
      tags: [Convenios]
      summary: Listar convenios (por cliente, estado, vigencia)
      parameters:
        - { name: rut, in: query, schema: { type: string }, description: RUT del cliente }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoVersionConvenio' } }
      responses:
        '200':
          description: Lista de convenios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConvenioResumen' }
    post:
      tags: [Convenios]
      summary: Crear un convenio con su primera versión (formulario manual, ADR-012)
      description: >
        Forma por defecto: formulario simple con RUT del cliente, vigencia, tipo de cambio mínimo
        (solo si hay tarifas en USD), días libres de almacenaje (solo si el convenio los tiene) y la
        tabla de servicios (servicio del catálogo, tarifa y moneda CLP o USD). La unidad de cobro no se
        digita: sale del catálogo. El comercial es opcional. La versión nace en estado BORRADOR y
        requiere confirmación humana para quedar VIGENTE.
        Variante opcional (etapa de IA, ADR-007): multipart con el documento PDF/Word; el servicio de
        extracción devuelve una propuesta en BORRADOR con score de confianza. No se construye hasta
        que el negocio la pida.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvenioManualRequest' }
          multipart/form-data:
            schema:
              type: object
              description: Etapa opcional de IA (ADR-007). No requerido en la Fase A.
              properties:
                rut: { type: string }
                comercial: { type: string }
                documento: { type: string, format: binary }
      responses:
        '201':
          description: Convenio creado con su versión en estado BORRADOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConvenio' }
        '400': { $ref: '#/components/responses/Error400' }

  /convenios/{convenioId}/versiones:
    post:
      tags: [Convenios]
      summary: Crear una nueva versión de un convenio existente (ajuste, renovación o complemento por correo)
      description: >
        Nunca se edita una versión vigente: cada cambio genera una versión nueva en BORRADOR.
        Al confirmarla, la anterior pasa a REEMPLAZADA y se conserva el histórico (RN-043, REQ-012).
      parameters:
        - { name: convenioId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaVersionConvenioRequest' }
      responses:
        '201':
          description: Nueva versión creada en estado BORRADOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConvenio' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }

  /convenios/{convenioId}/versiones/{versionId}/confirmar:
    post:
      tags: [Convenios]
      summary: Confirmar una versión de convenio (humano) → pasa a VIGENTE
      description: La IA nunca deja un convenio vigente por sí sola (ADR-007).
      parameters:
        - { name: convenioId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versión confirmada y vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConvenio' }
        '404': { $ref: '#/components/responses/Error404' }

  # ------------------------------------------------------------- Operaciones
  /operaciones:
    get:
      tags: [Operaciones]
      summary: Listar operaciones (por estado, cliente, pendientes de facturar)
      parameters:
        - { name: facturable, in: query, schema: { type: boolean } }
        - { name: rut, in: query, schema: { type: string } }
      responses:
        '200':
          description: Lista de operaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OperacionResumen' }

    post:
      tags: [Operaciones]
      summary: Registrar una operación a mano (puente de la Fase A hasta que exista la ingesta real)
      description: >
        [SUPUESTO] Mientras AEXSA SYS no entregue el evento por pull o push (PA-006, ADR-005), el
        facturador puede registrar el evento facturable por esta vía. Usa el mismo esquema que la
        ingesta automática y es idempotente por entidad + operacionIdAexsa + version. Cuando la ingesta real esté activa,
        esta vía queda como respaldo manual.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoFacturable' }
      responses:
        '201':
          description: Operación registrada y clasificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operacion' }
        '200':
          description: La operación ya existía (idempotente); se devuelve la existente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operacion' }
        '400': { $ref: '#/components/responses/Error400' }

  /operaciones/{operacionId}:
    get:
      tags: [Operaciones]
      summary: Detalle de una operación (ruta clasificada, servicios, destinatarios)
      parameters:
        - { name: operacionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle de la operación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operacion' }
        '404': { $ref: '#/components/responses/Error404' }

    patch:
      tags: [Operaciones]
      summary: Completar a mano los datos pendientes de una operación (auditable)
      description: >
        Los campos que AEXSA SYS no entrega (o entrega vacíos) los completa el facturador. Cada cambio
        exige motivo y queda en la auditoría con usuario, fecha, valor anterior y valor nuevo. Un dato
        completado a mano no se pisa con una versión posterior del evento salvo que AEXSA envíe un valor
        distinto de vacío; en ese caso se registra el conflicto y se pide decidir.
        También sirve para **corregir un dato que ya venía informado y estaba mal**, por ejemplo el
        tipo de retiro (DIRECTO o INDIRECTO). Si la operación ya tenía una OFA en BORRADOR o VALIDADA,
        se recalcula como una nueva versión de cálculo: la anterior se conserva en el histórico, los
        servicios agregados a mano se mantienen y los ajustes de monto se deben repetir. Una OFA ya
        ENVIADA o posterior no se recalcula: responde 409.
      parameters:
        - { name: operacionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletarOperacionRequest' }
      responses:
        '200':
          description: Operación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operacion' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }

  # --------------------------------------------------------------- Configuración
  /configuracion/terminales:
    get:
      tags: [Configuracion]
      summary: Mapeo de terminales de AEXSA a STI, DP World u otro (RN-079)
      responses:
        '200':
          description: Mapeo vigente y terminales vistos sin mapear
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TerminalMapa' }
  /configuracion/terminales/{terminalId}:
    put:
      tags: [Configuracion]
      summary: Asignar el grupo de un terminal (solo rol Administrador)
      parameters:
        - { name: terminalId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grupo]
              properties:
                grupo: { type: string, enum: [STI, DP_WORLD, OTRO] }
      responses:
        '200':
          description: Mapeo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalMapa' }
        '400': { $ref: '#/components/responses/Error400' }
  /configuracion/tipos-inspeccion:
    get:
      tags: [Configuracion]
      summary: Mapeo de los tipos de inspección de AEXSA a AFORO_ADUANA, SAG u OTRA (RN-052)
      description: >
        Un código de inspección que llega por primera vez en un evento se agrega como SIN_MAPEAR. Mientras
        no se mapee, los días bajo aforo de ese contenedor quedan como pendiente DIAS_AFORO.
      responses:
        '200':
          description: Tipos de inspección y su grupo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoInspeccionMapa' }
  /configuracion/tipos-inspeccion/{codigo}:
    put:
      tags: [Configuracion]
      summary: Asignar el grupo de un tipo de inspección (solo rol Administrador)
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grupo]
              properties:
                grupo: { type: string, enum: [AFORO_ADUANA, SAG, OTRA] }
      responses:
        '200':
          description: Mapeo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoInspeccionMapa' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }

  # --------------------------------------------------------------------- OFA
  /operaciones/{operacionId}/ofa:
    post:
      tags: [OFA]
      summary: Calcular/armar la OFA de una operación (motor determinístico)
      description: Ejecuta el pipeline de cálculo (ADR-006) y devuelve la OFA valorizada con su memoria.
      parameters:
        - { name: operacionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OFA calculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ofa' }

  /ofa/{ofaId}:
    get:
      tags: [OFA]
      summary: Obtener una OFA con sus líneas, destinatarios y memoria de cálculo
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OFA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ofa' }
        '404': { $ref: '#/components/responses/Error404' }

  /ofa/{ofaId}/lineas/{lineaId}/ajuste:
    post:
      tags: [OFA]
      summary: Aplicar un ajuste manual auditable a una línea (REQ-006, nivel 3)
      description: El monto lo fija la persona; queda registrado (usuario, motivo, valor anterior/nuevo). La IA no fija el monto.
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lineaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AjusteManualRequest' }
      responses:
        '200':
          description: Línea ajustada con su memoria actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineaOfa' }
        '400': { $ref: '#/components/responses/Error400' }

  /ofa/{ofaId}/lineas:
    post:
      tags: [OFA]
      summary: Agregar a mano un servicio que el cálculo no incluyó (REQ-006, nivel 3)
      description: >
        Para lo que la persona de facturación sabe y el sistema no. El servicio sale del catálogo; la
        cantidad la fija la persona; la tarifa es la del convenio o la pública si no se informa. La
        línea queda marcada como agregada a mano, con usuario, fecha y motivo (obligatorio) en su
        memoria de cálculo. La IA no fija el monto.
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgregarLineaRequest' }
      responses:
        '201':
          description: Línea agregada con su memoria de cálculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineaOfa' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }

  /ofa/{ofaId}/validar:
    post:
      tags: [OFA]
      summary: Validar completitud de la OFA antes de enviarla a SAP (REQ-008)
      description: Bloquea si falta destinatario, ítems sin tarifa, líneas sin artículo SAP, recargos/días sin resolver.
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resultado de la validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoValidacion' }

  /ofa/{ofaId}/enviar:
    post:
      tags: [OFA]
      summary: Encolar la OFA hacia SAP (Outbox asíncrono, ADR-002)
      description: >
        No llama a SAP en línea; escribe en el Outbox. El worker la envía por Agunsa Connect.
        La pantalla tiene el botón "Enviar a SAP" desde la Fase A, pero queda desactivado por
        configuración (`EnvioSapHabilitado = false`) hasta que exista la integración real (Fase B). Con la
        opción apagada este endpoint responde 409 con código `ENVIO_SAP_DESHABILITADO`.
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: OFA encolada (procesamiento asíncrono)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ofaId: { type: string, format: uuid }
                  estado: { $ref: '#/components/schemas/EstadoOfa' }
        '409':
          description: OFA incompleta o ya enviada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ofa/{ofaId}/reenviar-aexsa:
    post:
      tags: [OFA]
      summary: Reenviar a AEXSA SYS el aviso de factura emitida (desde la pantalla, Fase B)
      description: >
        Vuelve a encolar en el Outbox el aviso de factura emitida hacia AEXSA (ADR-004 revisado), sin
        tocar la base de datos. Idempotente por folio: AEXSA responde YA_RECIBIDO si ya lo tenía.
      parameters:
        - { name: ofaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Aviso encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ofaId: { type: string, format: uuid }
                  estado: { $ref: '#/components/schemas/EstadoOfa' }
        '409':
          description: La OFA aún no tiene folio conciliado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ----------------------------------------------------------------- Facturas
  /facturas:
    get:
      tags: [Facturas]
      summary: Listar facturas (por folio, operación, estado)
      parameters:
        - { name: folio, in: query, schema: { type: string } }
        - { name: operacionId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de facturas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Factura' }

  # ------------------------------------------------------------------- Pagos
  /pagos:
    get:
      tags: [Pagos]
      summary: Listar pagos y su conciliación (incluye impagos)
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPago' } }
      responses:
        '200':
          description: Lista de pagos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pago' }

  # --------------------------------------------------------------- Omisiones
  /operaciones/{operacionId}/omisiones:
    get:
      tags: [Omisiones]
      summary: Faltantes detectados (prestado vs. valorizado) para una operación (REQ-007)
      parameters:
        - { name: operacionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de posibles omisiones (propuestas; la decisión humana se registra)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Omision' }

  # --------------------------------------------------------------- Catálogo SAP (ADR-017)
  /catalogo:
    get:
      tags: [Catalogo]
      summary: Resumen del catálogo SAP vigente (versión, fecha y conteos)
      description: Pantalla T3. Solo lectura. Muestra qué versión del catálogo usará el cálculo.
      responses:
        '200':
          description: Catálogo vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoResumen' }
        '404': { $ref: '#/components/responses/Error404' }

  /catalogo/articulos:
    get:
      tags: [Catalogo]
      summary: Artículos de servicio del catálogo vigente (archivo A1)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Búsqueda por código o descripción }
      responses:
        '200':
          description: Lista de artículos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticuloSap' }

  /catalogo/listas-precios/{codigoLista}/precios:
    get:
      tags: [Catalogo]
      summary: Precios de una lista de precios del catálogo vigente (archivo A2)
      parameters:
        - { name: codigoLista, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Precios de la lista
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrecioLista' }
        '404': { $ref: '#/components/responses/Error404' }

  /catalogo/kits:
    get:
      tags: [Catalogo]
      summary: Kits con su composición (archivo A3). Referencia, no entrada del cálculo (ADR-017)
      parameters:
        - { name: ruta, in: query, schema: { type: string }, description: Filtra por ruta clasificada }
      responses:
        '200':
          description: Lista de kits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitSap' }

  /catalogo/tipo-cambio:
    get:
      tags: [Catalogo]
      summary: Tipo de cambio diario (archivo A4)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: moneda, in: query, schema: { type: string, enum: [USD, UF] } }
      responses:
        '200':
          description: Serie de tipo de cambio
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoCambio' }
    post:
      tags: [Catalogo]
      summary: Ingresar el tipo de cambio de un día (alternativa al archivo A4)
      description: >
        Lo ingresa facturación cuando falta el de SAP para ese día; queda con fuente MANUAL y auditado.
        Gana el valor de SAP, para que la prefactura coincida con la factura (ADR-017): si el día ya
        tiene valor de SAP (fuente API o ARCHIVO) responde 409, y si después llega el de SAP, reemplaza
        al manual. Los cálculos ya hechos no cambian, porque la memoria de cálculo guarda el valor usado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipoCambio' }
      responses:
        '201': { description: Tipo de cambio registrado }
        '400': { $ref: '#/components/responses/Error400' }
        '409':
          description: TIPO_CAMBIO_DE_SAP_EXISTE. El día ya tiene el valor de SAP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /catalogo/importaciones:
    post:
      tags: [Catalogo]
      summary: Subir un archivo del catálogo (A1 a A4). Valida y deja la importación pendiente de confirmar.
      description: >
        Formato de columnas en docs/desarrollo/formato-archivos-catalogo-sap.md. La importación no
        se activa sola: devuelve el resultado de la validación (formato, duplicados, artículos
        inactivos) y una persona la confirma.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo]
              description: >
                Con un tipo parcial (ARTICULOS, LISTAS_PRECIOS, KITS, TIPO_CAMBIO) se envía la parte
                `archivo`. Con COMPLETO se envían en el mismo request las partes `articulos`,
                `listasPrecios` y `kits` (obligatorias) y `tipoCambio` (opcional), cada una con el formato
                de su archivo (A1 a A4). Una importación parcial parte de la versión vigente: al
                confirmar, la versión nueva copia desde ella lo que no vino, así cada versión queda
                completa. La primera carga del catálogo debe ser COMPLETO o ARTICULOS.
              properties:
                tipo:
                  type: string
                  enum: [ARTICULOS, LISTAS_PRECIOS, KITS, TIPO_CAMBIO, SOCIOS_NEGOCIO, COMPLETO]
                  description: >
                    Mismos valores que catalogo_importacion.tipo. SOCIOS_NEGOCIO es el archivo A5
                    (RUT → código de cliente SAP); no está habilitado en la etapa 1 y responde 400 con
                    código TIPO_NO_HABILITADO. Su formato se define con la tarea 3.2.
                archivo: { type: string, format: binary, description: 'Tipos parciales. CSV UTF-8 separado por punto y coma' }
                articulos: { type: string, format: binary, description: 'Solo COMPLETO. Archivo A1' }
                listasPrecios: { type: string, format: binary, description: 'Solo COMPLETO. Archivo A2' }
                kits: { type: string, format: binary, description: 'Solo COMPLETO. Archivo A3' }
                tipoCambio: { type: string, format: binary, description: 'Solo COMPLETO, opcional. Archivo A4' }
      responses:
        '201':
          description: Archivo validado; pendiente de confirmación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoImportacion' }
        '400': { $ref: '#/components/responses/Error400' }

  /catalogo/importaciones/{importacionId}/confirmar:
    post:
      tags: [Catalogo]
      summary: Confirmar una importación (humano) → crea una nueva versión del catálogo
      parameters:
        - { name: importacionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Nueva versión de catálogo activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoResumen' }
        '404': { $ref: '#/components/responses/Error404' }

  /catalogo/vinculos:
    get:
      tags: [Catalogo]
      summary: Vínculo servicio del Satélite ↔ artículo SAP
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [PROPUESTO, CONFIRMADO, SIN_VINCULO] } }
      responses:
        '200':
          description: Vínculos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VinculoServicioArticulo' }

  /catalogo/vinculos/{tipoServicioId}:
    put:
      tags: [Catalogo]
      summary: Confirmar o cambiar el artículo SAP de un servicio
      description: >
        Una persona fija el vínculo. La sugerencia automática, si existe, solo propone. Una línea sin
        vínculo confirmado sale en la OFA como "sin artículo SAP" y no pasa la validación.
      parameters:
        - { name: tipoServicioId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [articuloSap]
              properties:
                articuloSap: { type: string }
      responses:
        '200':
          description: Vínculo confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VinculoServicioArticulo' }
        '400': { $ref: '#/components/responses/Error400' }

  # --------------------------------------------------------------- Callbacks
  /sap/callbacks/folio:
    post:
      tags: [Callbacks]
      summary: Recepción de folio/DTE desde SAP (vía Agunsa Connect) — ADR-002/004
      description: Entrada de integración. Une por folio y dispara la conciliación.
      security:
        - agunsaConnect: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolioCallback' }
      responses:
        '200': { description: Folio recibido y vinculado }
        '401': { $ref: '#/components/responses/Error401' }

  /aexsa/eventos:
    post:
      tags: [Callbacks]
      summary: Recepción del evento facturable que envía AEXSA SYS (vía de entrada, ADR-005)
      description: >
        AEXSA envía (push) desde su tabla de salida, con reintentos. Idempotente por entidad +
        operacionIdAexsa + version. Cada mensaje trae el estado completo de la operación. Algoritmo y
        tabla de respuestas: modelo-datos.md §4b y contratos-integracion.md §2. Autenticación definitiva
        según PA-002. En la etapa 1, VISADO_PRESENCIAL responde 400 con codigo ENTIDAD_NO_HABILITADA.
      security:
        - agunsaConnect: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoFacturable' }
      responses:
        '201':
          description: Operación nueva, mensaje aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
        '200':
          description: Versión mayor que la aplicada; la operación se actualizó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
        '409':
          description: >
            Ya recibido (misma versión, codigo YA_RECIBIDO) o versión más antigua que la aplicada
            (codigo VERSION_SUPERADA). AEXSA lo da por enviado y no reintenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
        '400':
          description: Mensaje inválido; AEXSA no reintenta y avisa para corregir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
        '401': { $ref: '#/components/responses/Error401' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Autenticación de usuarios del frontend. JWT emitido por Amazon Cognito, federado con
        Microsoft Entra ID (ADR-016). La API valida firma, emisor, audiencia y expiración;
        los roles (Comercial, Facturación, Recaudación, Administrador) vienen en el token.
    agunsaConnect:
      type: apiKey
      in: header
      name: X-AgunsaConnect-Signature
      description: >
        Firma/credencial del middleware corporativo para callbacks de integración (máquina a
        máquina, no usa Cognito de usuarios). Mecanismo definitivo según PA-002.

  responses:
    Error400:
      description: Solicitud inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error401:
      description: No autenticado / firma inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error404:
      description: No encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ----- enums
    Moneda:
      type: string
      enum: [CLP, USD, UF]
    UnidadCobro:
      type: string
      enum: [BL, DUS, CTR, CTR_DIA, TON, M3, CAMION, PALLET, UNIDAD]
    EstadoVersionConvenio:
      type: string
      enum: [BORRADOR, VIGENTE, VENCIDA, REEMPLAZADA]
    EstadoOfa:
      type: string
      enum: [BORRADOR, VALIDADA, ENVIADA, EMITIDA, EMITIDA_SIN_CONFIRMACION, CONCILIADA, INFORMADA_AEXSA]
      description: INFORMADA_AEXSA = AEXSA SYS acusó recibo de la factura emitida (ADR-004 revisado)
    EstadoPago:
      type: string
      enum: [PAGADA, PENDIENTE, PARCIAL]

    # ----- convenios
    ConvenioResumen:
      type: object
      properties:
        convenioId: { type: string, format: uuid }
        rut: { type: string }
        comercial: { type: string }
        versionVigente: { type: integer, nullable: true }
    VersionConvenio:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        convenioId: { type: string, format: uuid }
        numero: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoVersionConvenio' }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date, nullable: true }
        tcMinimo: { type: number, nullable: true }
        diasLibres: { type: integer, nullable: true }
        origen: { type: string, enum: [IA_EXTRAIDO, MANUAL, COMPLEMENTO_CORREO] }
        confianzaIa: { type: number, nullable: true, description: Score IA; null si manual }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/ServicioConvenio' }
    ServicioConvenio:
      type: object
      properties:
        tipoServicioId: { type: integer }
        tarifa: { type: number }
        moneda: { type: string, enum: [CLP, USD], description: 'Los convenios se cobran en CLP o USD; UF no aplica' }
        unidad:
          allOf:
            - $ref: '#/components/schemas/UnidadCobro'
          readOnly: true
          description: Sale del catálogo según el servicio; no se digita

    ConvenioManualRequest:
      type: object
      description: Formulario manual de convenio (por defecto, ADR-012). Simple a propósito.
      required: [rut, vigenciaDesde, servicios]
      properties:
        rut: { type: string, description: RUT del cliente (identidad del convenio) }
        razonSocial: { type: string, nullable: true }
        comercial: { type: string, nullable: true, description: Opcional; no afecta el cálculo }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date, nullable: true }
        tcMinimo: { type: number, nullable: true, description: Piso de dólar en CLP (RN-022) }
        diasLibres: { type: integer, nullable: true, description: Días libres de almacenaje (RN-023) }
        servicios:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ServicioConvenio' }
    NuevaVersionConvenioRequest:
      type: object
      required: [vigenciaDesde, servicios, origen]
      properties:
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date, nullable: true }
        tcMinimo: { type: number, nullable: true }
        diasLibres: { type: integer, nullable: true }
        origen: { type: string, enum: [MANUAL, COMPLEMENTO_CORREO] }
        motivo: { type: string, nullable: true }
        servicios:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ServicioConvenio' }

    # ----- catálogo SAP
    CatalogoResumen:
      type: object
      properties:
        version: { type: integer }
        fecha: { type: string, format: date-time }
        origen: { type: string, enum: [ARCHIVO, API] }
        articulos: { type: integer }
        listasPrecios: { type: integer }
        kits: { type: integer }
        tipoCambioAl: { type: string, format: date, nullable: true }
    ArticuloSap:
      type: object
      properties:
        codigoArticulo: { type: string }
        descripcion: { type: string }
        unidadMedida: { type: string }
        activo: { type: boolean }
        grupoArticulo: { type: string, nullable: true }
    PrecioLista:
      type: object
      properties:
        codigoLista: { type: string }
        nombreLista: { type: string }
        codigoArticulo: { type: string }
        precio: { type: number }
        moneda: { $ref: '#/components/schemas/Moneda' }
        vigenteDesde: { type: string, format: date }
        vigenteHasta: { type: string, format: date, nullable: true }
    KitSap:
      type: object
      properties:
        codigoKit: { type: string }
        nombre: { type: string }
        ruta: { type: string, nullable: true }
        activo: { type: boolean }
        articulos:
          type: array
          items:
            type: object
            properties:
              codigoArticulo: { type: string }
              cantidad: { type: number }
    TipoCambio:
      type: object
      required: [fecha, moneda, valor]
      properties:
        fecha: { type: string, format: date }
        moneda: { type: string, enum: [USD, UF] }
        valor: { type: number }
        fuente:
          type: string
          enum: [API, ARCHIVO, MANUAL]
          readOnly: true
          description: De dónde salió el valor. Mismo vocabulario que el origen del catálogo. MANUAL = ingresado por facturación.
    VinculoServicioArticulo:
      type: object
      properties:
        tipoServicioId: { type: integer }
        descripcionServicio: { type: string }
        articuloSap: { type: string, nullable: true }
        estado: { type: string, enum: [PROPUESTO, CONFIRMADO, SIN_VINCULO] }
        origen: { type: string, enum: [SUGERENCIA, MANUAL], nullable: true }
        confirmadoPor: { type: string, nullable: true }
    ResultadoImportacion:
      type: object
      properties:
        importacionId: { type: string, format: uuid }
        tipo: { type: string, enum: [ARTICULOS, LISTAS_PRECIOS, KITS, TIPO_CAMBIO, SOCIOS_NEGOCIO, COMPLETO] }
        versionBase: { type: integer, nullable: true, description: 'Versión vigente desde la que se copia lo que no vino. Null en COMPLETO y en la primera carga' }
        filasLeidas: { type: integer }
        filasValidas: { type: integer }
        errores:
          type: array
          items:
            type: object
            properties:
              fila: { type: integer }
              columna: { type: string }
              mensaje: { type: string }
        estado: { type: string, enum: [PENDIENTE_CONFIRMACION, RECHAZADA, CONFIRMADA] }

    # ----- operaciones
    OperacionResumen:
      type: object
      properties:
        operacionId: { type: string, format: uuid }
        entidad: { $ref: '#/components/schemas/EntidadOrigen' }
        operacionIdAexsa:
          type: array
          items: { type: integer, format: int64 }
        rut: { type: string }
        conConvenio: { type: boolean, description: 'Lo determina ZARPE buscando el convenio vigente por RUT; no viene de AEXSA' }
        facturable: { type: boolean }
    Operacion:
      allOf:
        - $ref: '#/components/schemas/OperacionResumen'
        - type: object
          properties:
            tipoCarga: { type: string, enum: [CONTENEDOR, BULTO] }
            sentido: { type: string, enum: [IMPORTACION, EXPORTACION], nullable: true }
            tipoRetiro: { type: string, enum: [DIRECTO, INDIRECTO], nullable: true }
            estadoOperacion: { type: string, enum: [ACTIVA, ANULADA] }
            terminal:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/TerminalAexsa'
            grupoTerminal:
              type: string
              enum: [STI, DP_WORLD, OTRO, SIN_MAPEAR]
              description: Resuelto por el Satélite con terminal_mapa. SIN_MAPEAR bloquea la decisión de refacturación del directo (RN-079).
            pendientes:
              type: array
              description: Datos que faltan y que el facturador debe completar antes de validar la OFA.
              items:
                type: string
                enum: [TIPO_RETIRO, SENTIDO, TERMINAL_SIN_MAPEAR, CANTIDAD_DUS, CANTIDAD_SERVICIO, DIAS_AFORO, FECHA_DESPACHO, VARIOS_CONVENIOS_VIGENTES, DOCUMENTO_CON_VARIAS_SOLICITUDES, INSPECCION_NO_FINALIZADA, INSPECCION_RECHAZADA]
            din:
              type: array
              items: { type: integer, format: int64 }
            cantidadDus: { type: integer, nullable: true, description: 'No viene de AEXSA; la completa el facturador en exportación (RN-047)' }
            bls:
              type: array
              items: { $ref: '#/components/schemas/BlDocumento' }
            papeletas:
              type: array
              items: { type: integer, format: int64 }
            consignatario: { $ref: '#/components/schemas/ParteFactura' }
            clienteFacturador:
              nullable: true
              description: Quien indicó AEXSA. Si es null, la OFA usa al consignatario por defecto (RN-077).
              allOf:
                - $ref: '#/components/schemas/ParteFactura'
            contenedores:
              type: array
              items: { $ref: '#/components/schemas/ContenedorOperacion' }
            versionEvento: { type: integer, description: Última versión del evento recibido de AEXSA }
            rutaClasificada: { type: string }
            momentoFacturacion: { type: string, enum: [EN_VISACION, POST_DESPACHO] }
            servicios:
              type: array
              items: { $ref: '#/components/schemas/ServicioPrestado' }
    ServicioPrestado:
      type: object
      description: Servicio de la operación ya normalizado por el Satélite (la unidad sale del catálogo, no del texto de AEXSA).
      required: [tipoServicioId, unidad]
      properties:
        tipoServicioId: { type: integer }
        cantidad: { type: number, nullable: true, description: null = pendiente de completar por el facturador }
        unidad: { $ref: '#/components/schemas/UnidadCobro' }
        contenedor: { type: string, nullable: true }
        finalizadoEn: { type: string, format: date-time, nullable: true }
        origen: { type: string, enum: [AEXSA, LIQUIDACION_PUERTO], nullable: true }

    # ----- OFA
    Ofa:
      type: object
      properties:
        ofaId: { type: string, format: uuid }
        operacionId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoOfa' }
        fechaCalculo: { type: string, format: date-time }
        asignaciones:
          type: array
          items: { $ref: '#/components/schemas/AsignacionCobro' }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaOfa' }
    AsignacionCobro:
      type: object
      properties:
        asignacionId: { type: string, format: uuid }
        destinatarioRut: { type: string }
        rol: { type: string, enum: [CONSIGNATARIO, FORWARDER, EMBARCADOR] }
        origenInstruccion: { type: string, nullable: true }
    LineaOfa:
      type: object
      properties:
        lineaId: { type: string, format: uuid }
        asignacionId: { type: string, format: uuid, nullable: true }
        tipoServicioId: { type: integer }
        articuloSap: { type: string, nullable: true, description: Código del artículo en SAP (ADR-017). Null = sin artículo SAP; la línea no pasa la validación. }
        cantidad: { type: number }
        unidad: { $ref: '#/components/schemas/UnidadCobro' }
        tarifa: { type: number }
        moneda: { $ref: '#/components/schemas/Moneda' }
        montoClp: { type: number }
        esExcepcion: { type: boolean }
        origen: { type: string, enum: [CALCULADA, AGREGADA_MANUAL, REGLA_CONFIGURABLE], description: 'Cómo nació la línea (modelo-datos DBA-6)' }
        enKitSap: { type: boolean, nullable: true, description: 'Está en el kit SAP sugerido; null si no hay kit (ADR-017)' }
        versionCalculo: { type: integer, description: Versión de cálculo de la OFA a la que pertenece la línea }
        agregadaPor: { type: string, nullable: true, description: 'Solo si origen = AGREGADA_MANUAL' }
        agregadaEn: { type: string, format: date-time, nullable: true, description: 'Solo si origen = AGREGADA_MANUAL' }
        motivoAgregada: { type: string, nullable: true, description: 'Solo si origen = AGREGADA_MANUAL (obligatorio en ese caso)' }
        memoria: { $ref: '#/components/schemas/MemoriaCalculo' }
    MemoriaCalculo:
      type: object
      description: Reconstrucción auditable del monto (REQ-011). Append-only.
      properties:
        reglasAplicadas:
          type: array
          items:
            type: object
            properties:
              regla: { type: string }
              version: { type: integer }
        versionConvenio: { type: integer, nullable: true }
        versionTarifaPublica: { type: integer, nullable: true }
        tipoCambioAplicado: { type: number, nullable: true }
        reglaConfigurableId: { type: string, format: uuid, nullable: true }
        ajusteManual: { $ref: '#/components/schemas/AjusteManual' }
    AjusteManualRequest:
      type: object
      required: [motivo, nuevoMonto]
      properties:
        nuevoMonto: { type: number }
        motivo: { type: string }
    AgregarLineaRequest:
      type: object
      required: [tipoServicioId, cantidad, motivo]
      properties:
        tipoServicioId: { type: integer, description: Servicio del catálogo }
        cantidad: { type: number, exclusiveMinimum: 0 }
        tarifa: { type: number, nullable: true, description: 'Opcional. Si no viene, se usa la del convenio o la pública' }
        motivo: { type: string, minLength: 1 }
    AjusteManual:
      type: object
      nullable: true
      properties:
        usuario: { type: string }
        fecha: { type: string, format: date-time }
        motivo: { type: string }
        valorAnterior: { type: number }
        valorNuevo: { type: number }
    ResultadoValidacion:
      type: object
      properties:
        valida: { type: boolean }
        faltantes:
          type: array
          items: { type: string }

    # ----- facturas / pagos / omisiones
    Factura:
      type: object
      properties:
        facturaId: { type: string, format: uuid }
        ofaId: { type: string, format: uuid }
        folio: { type: string }
        tipoDte: { type: integer }
        montoTotal: { type: number }
        moneda: { $ref: '#/components/schemas/Moneda' }
        emitidaEn: { type: string, format: date-time, nullable: true }
        conciliada: { type: boolean }
    Pago:
      type: object
      properties:
        pagoId: { type: string, format: uuid }
        referenciaSap: { type: string, nullable: true }
        pagadorRut: { type: string, nullable: true }
        monto: { type: number }
        estado: { $ref: '#/components/schemas/EstadoPago' }
        folios:
          type: array
          items: { type: string }
          description: Folios cubiertos (un pago puede agrupar varias facturas, RN-067)
    Omision:
      type: object
      properties:
        omisionId: { type: string, format: uuid }
        tipoServicioId: { type: integer }
        descripcion: { type: string }
        origen: { type: string, enum: [CRUCE_DETERMINISTICO, PROPUESTA_IA] }
        confianza: { type: number, nullable: true }
        decision: { type: string, enum: [INCLUIDA, DESCARTADA, COMPLEMENTARIA], nullable: true, description: null = sin decidir }
        motivo: { type: string, nullable: true }
        decididaPor: { type: string, nullable: true }

    # ----- callbacks
    FolioCallback:
      type: object
      required: [ofaId, folio, tipoDte]
      properties:
        ofaId: { type: string, format: uuid }
        folio: { type: string }
        tipoDte: { type: integer }
        montoNeto: { type: number }
        montoTotal: { type: number }
        dteXmlBase64: { type: string }
        emitidoEn: { type: string, format: date-time }
    EventoFacturable:
      type: object
      description: >
        Mensaje que AEXSA SYS envía al Satélite (v3.0: entidad, operacionIdAexsa como arreglo, bls con id
        y número; sin documentoCargaId, conConvenio, bajoAforo, dus ni cantidadDus). Trae el estado completo
        de la operación. Idempotente por entidad + operacionIdAexsa + version. Los campos de prioridad A
        están en `required` y siempre viajan, aunque algunos pueden ir null (sentido, tipoRetiro, terminal).
        din es obligatorio en importación (regla de validación). Detalle de prioridades y origen en
        contratos-integracion.md §2.
      required: [entidad, tipoEvento, version, operacionIdAexsa, visadoAprobadoEn, estadoOperacion, tipoCarga, sentido, tipoRetiro, terminal, bls, consignatario, servicios]
      properties:
        entidad: { $ref: '#/components/schemas/EntidadOrigen' }
        tipoEvento: { type: string, enum: [VISADO_APROBADO, OPERACION_ACTUALIZADA] }
        version: { type: integer, minimum: 1, description: Empieza en 1 y sube con cada actualización; el Satélite actualiza, no duplica }
        operacionIdAexsa:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }
          description: >
            IDs de AEXSA que generan la operación. VISADO_VIRTUAL: exactamente uno (SolicitudVisadoID);
            si trae otra cantidad, 400. VISADO_PRESENCIAL: puede traer varios (fuera de la etapa 1).
        visadoAprobadoEn: { type: string, format: date-time }
        estadoOperacion: { type: string, enum: [ACTIVA, ANULADA], description: ANULADA si el visado se devolvió o anuló después de enviado }
        tipoCarga: { type: string, enum: [CONTENEDOR, BULTO] }
        sentido: { type: string, enum: [IMPORTACION, EXPORTACION], nullable: true, description: Puede venir vacío en AEXSA }
        tipoRetiro:
          type: string
          enum: [DIRECTO, INDIRECTO]
          nullable: true
          description: Vacío en el 95,6 % de los contenedores del ambiente revisado. Si es null, el Satélite no clasifica la ruta y queda pendiente.
        terminal:
          nullable: true
          description: Puede venir null (cerca del 18 % de los documentos no tiene terminal).
          allOf:
            - $ref: '#/components/schemas/TerminalAexsa'
        din:
          type: array
          items: { type: integer, format: int64 }
          description: Números de DIN. Obligatorio en importación; vacío en exportación.
        bls:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BlDocumento' }
          description: >
            Documentos de carga de la operación (reemplaza a documentoCargaId). Si otra operación activa
            comparte un bls[].id, ambas quedan con el pendiente DOCUMENTO_CON_VARIAS_SOLICITUDES.
        papeletas:
          type: array
          items: { type: integer, format: int64 }
          description: IDs de papeleta. El contraste DIN↔papeleta (RN-001) lo hace el visador en AEXSA antes de aprobar.
        consignatario: { $ref: '#/components/schemas/ParteFactura' }
        clienteFacturador:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ParteFactura'
            - type: object
              properties:
                tipo: { type: string, enum: [EMISOR_BL, CLIENTE, GENERADOR_NEGOCIO, CONSIGNATARIO] }
                asignadoPor: { type: string, nullable: true }
                asignadoEn: { type: string, format: date-time, nullable: true }
        contenedores:
          type: array
          items: { $ref: '#/components/schemas/ContenedorOperacion' }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/ServicioEvento' }
    TerminalAexsa:
      type: object
      description: Terminal de retiro tal como está en el catálogo de AEXSA (hay 7). El Satélite lo asocia a un grupo con la tabla terminal_mapa.
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
    ResultadoIngesta:
      type: object
      required: [resultado]
      properties:
        resultado: { type: string, enum: [APLICADO, DUPLICADO, RECHAZADO] }
        codigo: { type: string, nullable: true, enum: [YA_RECIBIDO, VERSION_SUPERADA, INVALIDO, ENTIDAD_NO_HABILITADA, null] }
        operacionId: { type: string, format: uuid, nullable: true }
        versionAplicada: { type: integer, nullable: true, description: Versión vigente en el Satélite tras procesar el mensaje }
        errores:
          type: array
          items: { type: string }
    ServicioEvento:
      type: object
      required: [tipoServicioId, cantidad]
      properties:
        tipoServicioId: { type: integer }
        cantidad: { type: number, nullable: true, description: Puede venir vacía en AEXSA. Sin cantidad el servicio no se valoriza hasta que el facturador la complete. }
        unidad: { type: string, nullable: true, description: Texto tal como está en AEXSA (sin normalizar). Solo informativo; el Satélite normaliza por tipoServicioId. }
        contenedor: { type: string, nullable: true, description: AEXSA no lo guarda por servicio; llega vacío }
        finalizadoEn: { type: string, format: date-time, nullable: true }
        origen: { type: string, enum: [AEXSA, LIQUIDACION_PUERTO], nullable: true }
    TerminalMapa:
      type: object
      properties:
        terminalId: { type: integer }
        nombre: { type: string }
        grupo: { type: string, enum: [STI, DP_WORLD, OTRO, SIN_MAPEAR] }
        operacionesPendientes: { type: integer, description: Operaciones que esperan este mapeo }
    CompletarOperacionRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string }
        tipoRetiro: { type: string, enum: [DIRECTO, INDIRECTO], nullable: true }
        sentido: { type: string, enum: [IMPORTACION, EXPORTACION], nullable: true }
        cantidadDus: { type: integer, nullable: true }
        fechaDespacho: { type: string, format: date-time, nullable: true, description: Por contenedor si se indica `contenedor` }
        contenedor: { type: string, nullable: true }
        diasAforo: { type: integer, nullable: true }
        cantidadesServicio:
          type: array
          items:
            type: object
            required: [tipoServicioId, cantidad]
            properties:
              tipoServicioId: { type: integer }
              cantidad: { type: number }
    ParteFactura:
      type: object
      required: [rut]
      properties:
        rut: { type: string }
        razonSocial: { type: string, nullable: true }
    ContenedorOperacion:
      type: object
      required: [numero]
      properties:
        numero: { type: string }
        fechaRecepcion: { type: string, format: date-time, nullable: true }
        fechaRetiro: { type: string, format: date-time, nullable: true }
        fechaDespacho: { type: string, format: date-time, nullable: true }
        diasAlmacenaje: { type: integer, nullable: true, description: Calculado por AEXSA (RN-033), sin descontar días libres }
        esReefer: { type: boolean }
        inspecciones:
          type: array
          description: >
            Incluye el aforo (ya no hay bajoAforo). Los días bajo aforo (RN-052) salen de asignadaEn y
            finalizadaEn de la inspección de aforo; si falta finalizadaEn, queda el pendiente DIAS_AFORO.
          items:
            type: object
            required: [tipo]
            properties:
              tipo:
                type: string
                description: >
                  Código del catálogo de tipos de inspección de AEXSA (no el texto). El Satélite lo asocia a
                  AFORO_ADUANA, SAG u OTRA con la tabla tipo_inspeccion_mapa. Un código sin mapear deja los
                  días bajo aforo como pendiente DIAS_AFORO.
              asignadaEn: { type: string, format: date-time, nullable: true }
              finalizadaEn: { type: string, format: date-time, nullable: true }
              resultado:
                type: string
                nullable: true
                enum: [APROBADA, RECHAZADA_PARCIAL, RECHAZADA_TOTAL, VISADO_LIBERADO]
                description: >
                  null mientras la inspección no termina. No cambia el precio; controla la validación (RN-058):
                  sin finalizadaEn o con resultado null → pendiente INSPECCION_NO_FINALIZADA;
                  RECHAZADA_PARCIAL o RECHAZADA_TOTAL → pendiente INSPECCION_RECHAZADA (decide el facturador).
    TipoInspeccionMapa:
      type: object
      properties:
        codigo: { type: string, description: Código del tipo de inspección en AEXSA }
        descripcion: { type: string, nullable: true }
        grupo: { type: string, enum: [AFORO_ADUANA, SAG, OTRA, SIN_MAPEAR] }
        operacionesPendientes: { type: integer, description: Operaciones que esperan este mapeo }
    BlDocumento:
      type: object
      required: [id, numero]
      properties:
        id: { type: integer, format: int64, description: ID del documento de carga en AEXSA }
        numero: { type: string, description: Número del BL }
    EntidadOrigen:
      type: string
      enum: [VISADO_VIRTUAL, VISADO_PRESENCIAL]
      description: >
        Desde dónde llega la operación a facturar. Etapa 1: solo VISADO_VIRTUAL; VISADO_PRESENCIAL
        responde 400 ENTIDAD_NO_HABILITADA hasta definir su identidad.

    # ----- error comun
    Error:
      type: object
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        detalle: { type: string, nullable: true }

security:
  - bearerAuth: []
